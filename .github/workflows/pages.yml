# Deploys the app to GitHub Pages and bundles every library into ./vendor
# so the deployed site has ZERO CDN dependency (fully offline from first visit).
# Enable once: Repo → Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: LANGS=eng,hin,spa npm run vendor   # add/remove OCR languages here
      - run: |
          mkdir _site
          cp -r index.html style.css app.js sw.js manifest.json icons vendor _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
